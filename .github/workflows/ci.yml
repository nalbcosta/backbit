name: CI

on:
  push:
    branches: [ main, 'releases/**' ]
  pull_request:
    branches: [ main ]

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      node-version: 24
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install pnpm
        run: npm i -g pnpm@latest
      - name: Install
        run: pnpm install --frozen-lockfile

  lint:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pnpm
        run: npm i -g pnpm@latest
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: Run lint
        run: pnpm -w lint

  typecheck:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pnpm
        run: npm i -g pnpm@latest
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -w typecheck

  test:
    needs: [setup]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [apps/web, apps/api]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pnpm
        run: npm i -g pnpm@latest
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Run tests
        working-directory: ${{ matrix.app }}
        run: pnpm test

  build:
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pnpm
        run: npm i -g pnpm@latest
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Build web
        working-directory: apps/web
        run: pnpm build

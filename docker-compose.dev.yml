services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: backbit
    volumes:
      - mongo_data:/data/db

  api:
    build:
      context: .
      dockerfile: docker/dev/api.Dockerfile
    working_dir: /workspace
    command: pnpm --filter api start:dev
    ports:
      - '3001:3000'
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/backbit
    volumes:
      - .:/workspace
      - root_node_modules:/workspace/node_modules
      - api_node_modules:/workspace/apps/api/node_modules
    depends_on:
      - mongo

  web:
    build:
      context: .
      dockerfile: docker/dev/web.Dockerfile
    working_dir: /workspace
    command: pnpm --filter web dev
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_API_URL: http://localhost:3001
    volumes:
      - .:/workspace
      - root_node_modules:/workspace/node_modules
      - web_node_modules:/workspace/apps/web/node_modules
    depends_on:
      - api

volumes:
  mongo_data:
  root_node_modules:
  api_node_modules:
  web_node_modules:

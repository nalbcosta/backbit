services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: backbit
    volumes:
      - mongo_data:/data/db

  dependencies:
    build:
      context: .
      dockerfile: docker/dev/api.Dockerfile
      target: development
    image: backbit-api-dev
    working_dir: /workspace
    command: pnpm install --frozen-lockfile --store-dir /pnpm/store
    environment:
      CI: 'true'
    volumes:
      - .:/workspace
      - root_node_modules:/workspace/node_modules
      - api_node_modules:/workspace/apps/api/node_modules
      - web_node_modules:/workspace/apps/web/node_modules
      - pnpm_store:/pnpm/store

  api:
    image: backbit-api-dev
    working_dir: /workspace
    command: pnpm --filter api start:dev
    ports:
      - '3001:3000'
    environment:
      CI: 'true'
      CHOKIDAR_USEPOLLING: 'true'
      CHOKIDAR_INTERVAL: 300
      NODE_ENV: development
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/backbit
    volumes:
      - .:/workspace
      - root_node_modules:/workspace/node_modules
      - api_node_modules:/workspace/apps/api/node_modules
    depends_on:
      mongo:
        condition: service_started
      dependencies:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: docker/dev/web.Dockerfile
      target: development
    image: backbit-web-dev
    working_dir: /workspace
    command: pnpm --filter web dev:docker
    ports:
      - '3000:3000'
    environment:
      CI: 'true'
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_API_URL: http://localhost:3001
      WATCHPACK_POLLING: 'true'
    volumes:
      - .:/workspace
      - root_node_modules:/workspace/node_modules
      - web_node_modules:/workspace/apps/web/node_modules
    depends_on:
      api:
        condition: service_started
      dependencies:
        condition: service_completed_successfully

volumes:
  mongo_data:
  root_node_modules:
  api_node_modules:
  web_node_modules:
  pnpm_store:
